name: Build ARM64 & x64 APK

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android ARM64 (arm64-v8a) & x64 (x86_64) APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK, CMake & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Sync launcher web assets into Android APK assets
        run: |
          mkdir -p app/src/main/assets/owner-bootstrap
          cp -f tools/phone-build/owner-apk/index.html app/src/main/assets/owner-bootstrap/index.html
          cp -f tools/phone-build/owner-apk/owner-host.js app/src/main/assets/owner-bootstrap/owner-host.js
          cp -f launcher/app.js app/src/main/assets/owner-bootstrap/app.js
          cp -f launcher/controller.js app/src/main/assets/owner-bootstrap/controller.js
          cp -f launcher/feedback.js app/src/main/assets/owner-bootstrap/feedback.js
          cp -f launcher/style.css app/src/main/assets/owner-bootstrap/style.css
          cp -f launcher/background.png app/src/main/assets/owner-bootstrap/background.png

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble ARM64, x64 & Universal Debug APKs
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p dist-apks
          cp -f app/build/outputs/apk/debug/app-universal-debug.apk dist-apks/ror2-android-universal-debug.apk
          cp -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist-apks/ror2-android-arm64-v8a-debug.apk
          cp -f app/build/outputs/apk/debug/app-x86_64-debug.apk dist-apks/ror2-android-x86_64-debug.apk

      - name: Verify ARM64 & x86_64 Native Libraries Inside APKs
        run: |
          unzip -l dist-apks/ror2-android-universal-debug.apk | grep "lib/arm64-v8a/"
          unzip -l dist-apks/ror2-android-universal-debug.apk | grep "lib/x86_64/"
          unzip -l dist-apks/ror2-android-arm64-v8a-debug.apk | grep "lib/arm64-v8a/"
          unzip -l dist-apks/ror2-android-x86_64-debug.apk | grep "lib/x86_64/"

      - name: Upload ARM64, x64 & Universal APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ror2-android-arm64-and-x64-apks
          path: dist-apks/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          generate_release_notes: true
