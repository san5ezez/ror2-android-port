plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ror2lab.x86_64'
    compileSdk 34

    defaultConfig {
        applicationId "dev.ror2lab.universal"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1.0-arm64-x64"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fPIC -O2"
                arguments "-DANDROID_PLATFORM=android-23"
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
